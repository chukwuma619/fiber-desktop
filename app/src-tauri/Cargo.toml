[package]
name = "fiber-desktop"
version = "0.1.0"
description = "Desktop shell for the Fiber Network Node (fnn)"
authors = ["Chukwuma Ebube <chukwuma619@gmail.com>"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fiber_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
ureq = { version = "2.10", features = ["json"] }
parking_lot = "0.12"
flate2 = "1.0"
tar = "0.4"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

