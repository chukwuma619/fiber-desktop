# CI: Linux runs frontend build, rustfmt, and clippy. macOS runs a full `tauri build` (ad-hoc signed .app
# unless you add Apple signing env vars in the workflow or to the repo).
#
# Optional Apple notarization / Developer ID signing typically uses GitHub Encrypted Secrets such as
# APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID.
# See: https://v2.tauri.app/distribute/sign/macos/
#
# Linux: `cargo clippy` compiles gtk/sys crates — install WebKit/GTK dev libs (see Tauri Linux prerequisites).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `scripts/prepare-fnn-sidecar.sh` uses `rustc --print host-tuple`; install Rust before prepare.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Tauri on Linux: glib-sys / gtk need .pc files from system packages.
      - name: Install Linux dependencies (Tauri / GTK / WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: bun install --frozen-lockfile

      - run: bun run prepare:fnn

      - run: bun run build

      - run: cargo fmt --all -- --check
        working-directory: src-tauri

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  bundle-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - run: bun run prepare:fnn

      - run: bun run tauri build

  bundle-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - run: bun run prepare:fnn

      - run: bun run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: fiber-desktop-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
