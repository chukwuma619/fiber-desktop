# Build Tauri installers on tag push and attach them to a GitHub Release.
#
# Usage:
#   1. Bump version in app/src-tauri/tauri.conf.json (and app/package.json if you keep them in sync).
#   2. Commit and push to main (or your default branch).
#   3. Create and push a tag matching v* (e.g. git tag v0.1.0 && git push origin v0.1.0).
#
# The marketing /download page uses GET /repos/{owner}/{repo}/releases/latest — published
# releases with .dmg / .exe / .msi / .deb / .AppImage / .rpm assets are picked up automatically.
#
# Optional macOS signing: set repository secrets per https://v2.tauri.app/distribute/sign/macos/

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - run: bun run prepare:fnn

      - run: bun run tauri build

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: fiber-release-macos
          path: app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - run: bun run prepare:fnn

      - run: bun run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: fiber-release-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (Tauri / GTK / WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - run: bun run prepare:fnn

      - run: bun run tauri build

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: fiber-release-linux
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

  publish:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: fiber-release-*
          path: installers
          merge-multiple: true

      - name: Stage release assets
        run: |
          mkdir -p upload
          find installers -type f \( \
            -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
            \) -exec cp -v {} upload/ \;
          echo "Staged:"
          ls -la upload
          count="$(find upload -type f | wc -l | tr -d ' ')"
          if [ "$count" -lt 1 ]; then
            echo "No installer files found to publish."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fiber Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
