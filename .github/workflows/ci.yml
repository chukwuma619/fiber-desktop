# CI: Desktop (app/) + marketing site (marketing/). Workflows live at repo root.
#
# Path filters: marketing-only PRs skip Tauri bundles; app-only skips marketing lint/build.
# Workflow-wide `on.push.paths` avoids spinning runners for unrelated root-only edits.
#
# Optional Apple signing secrets: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, etc.
# See: https://v2.tauri.app/distribute/sign/macos/

name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "marketing/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "app/**"
      - "marketing/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      marketing: ${{ steps.filter.outputs.marketing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'
            marketing:
              - 'marketing/**'
              - '.github/workflows/ci.yml'

  marketing:
    needs: changes
    if: needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run build

  check:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux dependencies (Tauri / GTK / WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: bun install --frozen-lockfile

      - run: bun run prepare:fnn

      - run: bun run build

      - run: cargo fmt --all -- --check
        working-directory: app/src-tauri

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: app/src-tauri

  clippy-windows:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - run: bun install --frozen-lockfile

      - run: bun run prepare:fnn

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  bundle-macos:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - run: bun run prepare:fnn

      - run: bun run tauri build

  bundle-windows:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - run: bun run prepare:fnn

      - run: bun run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: fiber-desktop-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  bundle-linux:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (Tauri / GTK / WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - run: bun run prepare:fnn

      - run: bun run tauri build

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: fiber-desktop-linux
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
